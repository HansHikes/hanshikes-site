<!DOCTYPE html>
<html lang="en-GB">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0E7;--sheet:#F8F9F3;--ink:#18261E;--moss:#2E5A43;--waymark:#E9B200;--line:#C9D0C0;--muted:#56645A;--bad:#A33A2E;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--paper:#111814;--sheet:#18211C;--ink:#E6EBE2;--moss:#8CC4A2;--waymark:#F2C230;--line:#2D3A32;--muted:#9AA79D;--bad:#E48173;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--moss);text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.02em}
h3{font-size:28px;font-weight:800;letter-spacing:-.01em;margin-bottom:14px}
h4{font-size:19px;font-weight:700;margin-bottom:8px}
p{margin:0}
:focus-visible{outline:3px solid var(--waymark);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:62px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{text-decoration:none}
.logo-chip{display:inline-flex;align-items:center;background:#1F3328;border-radius:12px;padding:6px 12px}
.logo-chip img{display:block;height:44px;width:auto}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{font-size:15px;text-decoration:none;color:var(--ink);padding:7px 11px;border-radius:999px;font-weight:700}
nav.main a:hover{background:var(--sheet)}
nav.main a.cur{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 16px var(--body);padding:12px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.way{background:var(--waymark);border-color:var(--waymark);color:#1A1A10}
main{padding:34px 0 60px}
.ooo-hero{position:relative;border-radius:18px;overflow:hidden;min-height:360px;display:flex;align-items:flex-end;margin-bottom:24px}
.ooo-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ooo-hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(12,22,16,.88) 0%,rgba(12,22,16,.6) 50%,rgba(12,22,16,.1) 85%)}
.ooo-hero .inner{position:relative;z-index:2;padding:34px;max-width:660px;color:#F3F4EE}
.ooo-hero h2{color:#F3F4EE}
.ooo-hero .mark{color:#E9B200;font-weight:700;margin-bottom:8px}
.ooo-hero p{margin-top:12px;font-size:18px;color:#DDE3D8}
.facts{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 18px}
.facts b{display:block;font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.facts span{font-size:14px;color:var(--muted)}
.sec{margin-top:48px}
.sec ul{margin:0;padding-left:0;list-style:none;display:grid;gap:8px}
.sec ul li{padding-left:2px}
.sec .card ul li,.sec .cols li,.sec .menu li{padding-left:18px;position:relative}
.card ul li::before,.cols li::before,.menu li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--waymark)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.card h3{font-size:22px}
.lead{max-width:72ch;margin-bottom:18px}
.cols{columns:2;column-gap:28px;display:block!important}.cols li{break-inside:avoid;margin-bottom:8px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.menu>div{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.menu li span{white-space:nowrap;font-weight:700;color:var(--moss);margin-left:4px}
.tip{margin-top:18px;border-left:6px solid var(--waymark);padding:6px 0 6px 16px}
.sign{font-family:var(--hand);font-size:30px;color:var(--moss);margin-top:20px}
.explore{background:#1F3328;color:#EEF0E7;border-radius:18px;padding:30px}
.explore h3{color:#EEF0E7}.explore p{color:#D6DCD2;max-width:60ch}
.explore .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.explore .btn{background:#E9B200;border-color:#E9B200;color:#1A1A10}
.explore .btn.ghost{background:transparent;color:#EEF0E7;border-color:#EEF0E7}
.gate{max-width:460px;margin:60px auto;background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:30px;display:grid;gap:14px;text-align:center}
.gate .hand{font-family:var(--hand);font-size:28px;color:var(--moss)}
.gate input{font:17px var(--body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.gate .err{color:var(--bad);font-weight:700;min-height:1.4em}
.rsvp{display:grid;gap:18px;max-width:760px}
.rsvp label{display:grid;gap:6px;font-weight:700}
.rsvp small{font-weight:400;color:var(--muted)}
.rsvp input:not([type=radio]):not([type=checkbox]),.rsvp textarea{font:16px var(--body);padding:11px 13px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.rsvp fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
.rsvp legend{font-family:var(--display);font-weight:700;font-size:19px;margin-bottom:6px}
.rsvp .opt{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.rsvp .opt input{margin-top:.35em;accent-color:var(--moss);width:18px;height:18px;flex:none}
.rsvp .ticks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.rsvp .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.rsvp .btn{justify-self:start}
.rsvp .status{font-weight:700;min-height:1.4em}.rsvp .status.ok{color:var(--moss)}.rsvp .status.bad{color:var(--bad)}
@media (max-width:820px){.rsvp .row2{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:15px}
footer .wrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between;align-items:center}
footer nav{display:flex;gap:14px;flex-wrap:wrap}
@media (max-width:820px){.split{grid-template-columns:1fr}.cols{columns:1}.ooo-hero .inner{padding:24px}}
</style>
</head>

const KEY = "hhc-pw:" + location.pathname;
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:u8(DATA.salt), iterations:DATA.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:u8(DATA.iv)}, key, u8(DATA.ct));
  return new TextDecoder().decode(plain);
}
function show(html){
  document.getElementById("gate").hidden = true;
  const c = document.getElementById("content"); c.innerHTML = html; c.hidden = false;
}
document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value.trim();
  const err = document.getElementById("err"); err.textContent = "";
  try { const html = await unlock(pw); try{ sessionStorage.setItem(KEY, pw) }catch(_){} show(html); }
  catch(_) { err.textContent = "That password didn't work. Check your welcome email and try again."; }
});

const W3_KEY = "e82807cb-123d-48c2-b64e-32f597e30640";
document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-w3]"); if(!f) return;
  e.preventDefault();
  const st = f.querySelector(".status"), btn = f.querySelector("button[type=submit]");
  const fd = new FormData(f);
  const fields = {access_key: W3_KEY, subject: f.dataset.subject, from_name: "Han's Hike Club website", "Page": location.href};
  for (const [k,v] of fd.entries()) { if(k==="diet") continue; if(String(v).trim()) fields[k] = String(v).trim(); }
  const diet = fd.getAll("diet"); fields["Dietary requirements"] = diet.length ? diet.join(", ") : "Not ticked";
  if (fields.email) { fields.replyto = fields.email; fields["Email"] = fields.email; delete fields.email; }
  btn.disabled = true; st.className = "status"; st.textContent = "Sending…";
  try {
    const r = await fetch("https://api.web3forms.com/submit", {method:"POST", headers:{"Content-Type":"application/json", Accept:"application/json"}, body: JSON.stringify(fields)});
    const out = await r.json().catch(()=>({}));
    if(!r.ok || out.success === false) throw new Error("send failed");
    st.className = "status ok"; st.textContent = "Thank you! That's landed with Han. See you on the hill 🌿";
    f.reset();
  } catch(_) {
    st.className = "status bad";
    st.innerHTML = 'That didn\'t send. Please try again, or email your choices to <a href="mailto:hello@hanshikes.com?subject=' + encodeURIComponent(f.dataset.subject) + '">hello@hanshikes.com</a>.';
  } finally { btn.disabled = false; }
});
(async () => { let pw = null; try{ pw = sessionStorage.getItem(KEY) }catch(_){}
  if(pw){ try{ show(await unlock(pw)) }catch(_){} } })();
</script>
